services:
  dataset-capture-proxy:
    build:
      context: .
      dockerfile: Dockerfile.capture-proxy
    ports:
      - "8080:8080"
    environment:
      CAPTURE_PROXY_LISTEN: ":8080"
      CAPTURE_PROXY_UPSTREAM: "${CAPTURE_PROXY_UPSTREAM}"
      DATASET_CAPTURE_HMAC_KEY: "${DATASET_CAPTURE_HMAC_KEY}"
      DATASET_CAPTURE_PATH: "/data/sample-{date}-{node}.jsonl"
      DATASET_CAPTURE_QUEUE_SIZE: "128"
      DATASET_CAPTURE_MAX_DISK_GB: "10"
      NODE_NAME: "capture-proxy"
    volumes:
      - ./logs/datasets:/data
    restart: unless-stopped
